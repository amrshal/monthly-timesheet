services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: monthly_timesheet
      MYSQL_USER: timesheet
      MYSQL_PASSWORD: timesheet
      MYSQL_ROOT_PASSWORD: root-timesheet
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JDBC_URL: jdbc:mysql://mysql:3306/monthly_timesheet?sslMode=DISABLED
      JDBC_USER: timesheet
      JDBC_PASSWORD: timesheet
      DB_SSL_MODE: DISABLED
      INITIAL_ADMIN_EMAIL: admin@example.com
      INITIAL_ADMIN_PASSWORD: change-me-please
      INITIAL_ADMIN_NAME: Initial Administrator
      SESSION_SECRET: local-development-secret-change-me
      HTTP_PORT: 8080
    ports:
      - "8080:8080"
