<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit log</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
    <h1>Audit log</h1>
    <table class="admin-table">
        <thead>
        <tr>
            <th>Time</th>
            <th>Actor</th>
            <th>Subject</th>
            <th>Event</th>
            <th>Entity</th>
            <th>Details</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
            <td th:text="${event.eventTime}">Time</td>
            <td th:text="${event.actorUserId}">Actor</td>
            <td th:text="${event.subjectUserId}">Subject</td>
            <td th:text="${event.eventType}">Event</td>
            <td th:text="${event.entityType + ':' + event.entityId}">Entity</td>
            <td><code th:text="${event.detailsJson}">{}</code></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
