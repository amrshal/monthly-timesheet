<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager dashboard</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
    <h1>Manager dashboard</h1>
    <p><a href="/manager/users/new">Create employee</a></p>

    <h2>Awaiting approval</h2>
    <table class="admin-table">
        <thead>
        <tr>
            <th>Employee ID</th>
            <th>Month</th>
            <th>Submitted at</th>
            <th>Review</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="timesheet : ${awaitingApproval}">
            <td th:text="${timesheet.userId}">1</td>
            <td th:text="${timesheet.year + '-' + timesheet.month}">2026-8</td>
            <td th:text="${timesheet.submittedAt}">Submitted</td>
            <td><a th:href="@{/manager/timesheets/{id}(id=${timesheet.id})}">Review</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Assigned employees</h2>
    <ul>
        <li th:each="employee : ${employees}" th:text="${employee.displayName + ' (' + employee.email + ')'}">Employee</li>
    </ul>
</main>
</body>
</html>
