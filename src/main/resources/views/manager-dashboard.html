<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager dashboard</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
    <h1>Manager dashboard</h1>
    <h2>Awaiting approval</h2>
    <table class="admin-table">
        <thead>
        <tr>
            <th>Employee</th>
            <th>Month</th>
            <th>Submitted at</th>
            <th>Review</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="review : ${awaitingApproval}">
            <td th:text="${review.employee.displayName}">Employee</td>
            <td th:text="${review.timesheet.year + '-' + review.timesheet.month}">2026-8</td>
            <td th:text="${review.timesheet.submittedAt}">Submitted</td>
            <td><a th:href="@{/manager/timesheets/{id}(id=${review.timesheet.id})}">Review</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Assigned employees</h2>
    <ul>
        <li th:each="employee : ${employees}">
            <span th:text="${employee.displayName + ' (' + employee.email + ')'}">Employee</span>
            <a th:href="@{/manager/employees/{id}/timesheets/{year}/{month}(id=${employee.id},year=${currentMonth.year},month=${currentMonth.monthValue})}">Open current month</a>
        </li>
    </ul>
</main>
</body>
</html>
