<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manager dashboard</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
    <h1>Manager dashboard</h1>
    <h2>Awaiting approval</h2>
    <table class="admin-table">
        <thead>
        <tr>
            <th>Employee</th>
            <th>Month</th>
            <th>Total</th>
            <th>Submitted at</th>
            <th>Submitted by</th>
            <th>Review</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="review : ${awaitingApproval}">
            <td th:text="${review.employee.displayName}">Employee</td>
            <td th:text="${review.timesheet.year + '-' + review.timesheet.month}">2026-8</td>
            <td th:text="${review.total}">00:00</td>
            <td th:text="${review.timesheet.submittedAt}">Submitted</td>
            <td th:text="${review.submittedBy}">Submitter</td>
            <td><a th:href="@{/manager/timesheets/{id}(id=${review.timesheet.id})}">Review</a></td>
        </tr>
        </tbody>
    </table>

    <h2>Assigned employees</h2>
    <ul>
        <li th:each="employee : ${employees}">
            <span th:text="${employee.displayName + ' (' + employee.email + ')'}">Employee</span>
            <a th:href="@{/manager/employees/{id}/timesheets/{year}/{month}(id=${employee.id},year=${currentMonth.year},month=${currentMonth.monthValue})}">Open current month</a>
        </li>
    </ul>

    <h2>Other timesheets</h2>
    <form method="get" action="/manager/timesheets" class="filter-form">
        <label>
            Employee
            <select name="employeeId">
                <option value="">Any employee</option>
                <option
                    th:each="employee : ${employees}"
                    th:value="${employee.id}"
                    th:selected="${selectedEmployeeId == employee.id}"
                    th:text="${employee.displayName + ' (' + employee.email + ')'}"
                ></option>
            </select>
        </label>
        <label>
            Year
            <input name="year" type="number" min="2000" max="2100" th:value="${selectedYear}">
        </label>
        <label>
            Month
            <input name="month" type="number" min="1" max="12" th:value="${selectedMonth}">
        </label>
        <label>
            Status
            <select name="status">
                <option value="">Any status</option>
                <option
                    th:each="status : ${statuses}"
                    th:value="${status}"
                    th:selected="${selectedStatus == status.name()}"
                    th:text="${status}"
                ></option>
            </select>
        </label>
        <button type="submit">Filter</button>
    </form>
    <table class="admin-table">
        <thead>
        <tr>
            <th>Employee</th>
            <th>Month</th>
            <th>Status</th>
            <th>Total</th>
            <th>Open</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${managedTimesheets}">
            <td th:text="${row.employee.displayName}">Employee</td>
            <td th:text="${row.timesheet.year + '-' + row.timesheet.month}">2026-8</td>
            <td th:text="${row.timesheet.status}">DRAFT</td>
            <td th:text="${row.total}">00:00</td>
            <td><a th:href="@{/manager/timesheets/{id}(id=${row.timesheet.id})}">Open</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
