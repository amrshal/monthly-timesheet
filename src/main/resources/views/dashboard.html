<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Dashboard</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
    <h1 th:text="${title}">Dashboard</h1>
    <p th:text="${message}">Message</p>

    <form method="get" action="/admin/timesheets" th:if="${users} != null">
        <label>
            Employee
            <select name="userId" required>
                <option value="">Select employee</option>
                <option th:each="user : ${users}" th:value="${user.id}" th:text="${user.displayName + ' (' + user.email + ')'}"></option>
            </select>
        </label>
        <label>
            Year
            <input name="year" type="number" min="2000" max="2100" required th:value="${currentYear}">
        </label>
        <label>
            Month
            <input name="month" type="number" min="1" max="12" required th:value="${currentMonth}">
        </label>
        <button type="submit">Open timesheet</button>
    </form>

    <p th:if="${timesheet} != null">
        <a th:href="@{/admin/timesheets/{id}(id=${timesheet.id})}">Open timesheet</a>
    </p>
</main>
</body>
</html>
